<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mikan &amp; Yami — Aventura Pixel</title>
<style>
  :root{
    --shell:#241934;
    --shell-2:#2f2145;
    --edge:#120c1c;
    --accent:#ff3d81;
    --accent-2:#ffd447;
    --ink:#f3e9ff;
    --dim:#a08fc0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(circle at 50% 0%, #3b2a5c 0%, #1a1128 55%, #0d0916 100%);
    color:var(--ink);
    font-family:"Courier New",ui-monospace,monospace;
    display:flex;align-items:center;justify-content:center;
    padding:14px;min-height:100%;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .consola{
    width:100%;max-width:820px;
    background:linear-gradient(180deg,var(--shell-2),var(--shell));
    border:3px solid var(--edge);
    border-radius:18px;
    box-shadow:0 18px 0 -6px #0a0713, 0 30px 60px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.08);
    padding:14px;
  }
  .barra{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:10px;flex-wrap:wrap;
  }
  .logo{
    font-weight:700;letter-spacing:.14em;font-size:13px;
    color:var(--accent-2);text-transform:uppercase;
  }
  .logo b{color:var(--accent)}
  .stats{display:flex;gap:14px;font-size:12px;letter-spacing:.08em;color:var(--dim)}
  .stats span b{color:var(--ink)}
  .pantalla{
    position:relative;background:#000;border:3px solid var(--edge);
    border-radius:10px;overflow:hidden;line-height:0;
  }
  canvas{
    display:block;width:100%;height:auto;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }
  .scan{
    position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 2px,rgba(0,0,0,0) 2px 4px);
    mix-blend-mode:multiply;
  }
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;
    background:rgba(12,8,22,.86);text-align:center;padding:18px;line-height:1.5;
  }
  .overlay.oculto{display:none}
  .overlay h2{font-size:clamp(16px,3.4vw,26px);letter-spacing:.1em;color:var(--accent-2)}
  .overlay p{font-size:clamp(11px,2.2vw,14px);color:var(--dim);max-width:46ch}
  .overlay .duo{display:flex;gap:26px;margin-bottom:4px}
  .overlay .duo div{font-size:11px;color:var(--dim)}
  .overlay .duo b{display:block;font-size:13px;color:var(--ink);margin-bottom:2px}
  .btn{
    background:var(--accent);color:#1a0a14;border:none;
    font-family:inherit;font-weight:700;letter-spacing:.12em;
    padding:11px 24px;border-radius:8px;cursor:pointer;
    box-shadow:0 4px 0 #a3164c;text-transform:uppercase;font-size:13px;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a3164c}
  .btn:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px}
  .mini{
    background:#3a2a55;color:var(--ink);border:1px solid #4d3a70;
    font-family:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 10px;border-radius:6px;cursor:pointer;
  }
  .mini:hover{border-color:var(--accent-2);color:var(--accent-2)}
  .mini:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
  .niveles{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:100%;
  }
  .niveles.oculto{display:none}
  .niveles button{
    background:#241a38;color:var(--ink);border:1px solid #4d3a70;
    font-family:inherit;font-size:10px;letter-spacing:.06em;
    padding:6px 9px;border-radius:6px;cursor:pointer;line-height:1.3;
    max-width:132px;
  }
  .niveles button b{display:block;color:var(--accent-2);font-size:11px;margin-bottom:2px}
  .niveles button:hover{border-color:var(--accent);}
  .niveles button.act{border-color:var(--accent);background:#3a1f3a}
  .niveles button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
  .ayuda{
    margin-top:10px;font-size:11px;color:var(--dim);
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;letter-spacing:.06em;
  }
  .ayuda kbd{
    background:#160f24;border:1px solid #3d2c5c;border-bottom-width:3px;
    border-radius:5px;padding:2px 7px;color:var(--ink);font-family:inherit;font-size:11px;
  }
  .tactil{display:none;margin-top:12px;justify-content:space-between;gap:10px}
  .tactil .grupo{display:flex;gap:10px}
  .tactil button{
    width:62px;height:62px;border-radius:50%;border:2px solid var(--edge);
    background:#3a2a55;color:var(--ink);font-size:20px;font-family:inherit;
    box-shadow:0 4px 0 #17102a;cursor:pointer;
  }
  .tactil button.j{background:var(--accent);color:#1a0a14;box-shadow:0 4px 0 #a3164c}
  .tactil button.s{background:var(--accent-2);color:#2b1c05;box-shadow:0 4px 0 #a8880f;font-size:14px;font-weight:700}
  .tactil button:active{transform:translateY(3px)}
  @media (hover:none) and (pointer:coarse){ .tactil{display:flex} .ayuda{display:none} }
  @media (prefers-reduced-motion:reduce){ .scan{display:none} }
</style>
</head>
<body>
<div class="consola">
  <div class="barra">
    <div class="logo">Mikan <b>&amp;</b> Yami</div>
    <div class="stats">
      <span>Nivel <b id="uiNivel">1</b>/5</span>
      <span>Taiyaki <b id="uiMonedas">0</b></span>
      <span>Vidas <b id="uiVidas">3</b></span>
      <span>Activa <b id="uiChar">Mikan</b></span>
      <button class="mini" id="btnNiveles">Niveles</button>
    </div>
  </div>

  <div class="pantalla">
    <canvas id="game" width="480" height="272"></canvas>
    <div class="scan"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitulo">Aventura Pixel</h2>
      <p id="ovTexto">Dos hermanas, cinco niveles: de la secundaria hasta su casa.</p>
      <div class="duo" id="ovDuo">
        <div><b>Mikan</b>salto alto</div>
        <div><b>Yami</b>doble salto · veloz</div>
      </div>
      <div class="niveles oculto" id="ovNiveles"></div>
      <button class="btn" id="ovBtn">Empezar</button>
    </div>
  </div>

  <div class="ayuda">
    <span><kbd>←</kbd><kbd>→</kbd> moverse</span>
    <span><kbd>Espacio</kbd> saltar</span>
    <span><kbd>C</kbd> cambiar hermana</span>
    <span><kbd>R</kbd> reiniciar nivel</span>
    <span><kbd>N</kbd> elegir nivel</span>
  </div>

  <div class="tactil">
    <div class="grupo">
      <button id="tIzq" aria-label="Izquierda">◀</button>
      <button id="tDer" aria-label="Derecha">▶</button>
    </div>
    <div class="grupo">
      <button class="s" id="tSwap" aria-label="Cambiar hermana">SWAP</button>
      <button class="j" id="tSalto" aria-label="Saltar">▲</button>
    </div>
  </div>
</div>

function pintar(mapa, pal){
  const ancho = mapa.reduce(function(m,r){ return Math.max(m, r.length); }, 0);
  const alto = mapa.length;
  const c = document.createElement("canvas");
  c.width = ancho; c.height = alto;
  const g = c.getContext("2d");
  for(let y=0;y<alto;y++){
    const fila = mapa[y];
    for(let x=0;x<fila.length;x++){
      const col = pal[fila[x]];
      if(!col) continue;
      g.fillStyle = col;
      g.fillRect(x,y,1,1);
    }
  }
  return c;
}

function recorte(origen, sx, sy, sw, sh){
  const c = document.createElement("canvas");
  c.width = sw; c.height = sh;
  c.getContext("2d").drawImage(origen, sx, sy, sw, sh, 0, 0, sw, sh);
  return c;
}

// Separa el sprite del personaje en torso + dos piernas para animarlas aparte.
function armarPersonaje(nombre, mapa, pal, stats){
  const full = pintar(mapa, pal);
  const w = full.width, h = full.height;
  const legRow = stats.legRow, split = stats.split;
  return Object.assign({
    nombre,
    full,
    w: w, h: h,
    // el sprite se centra sobre la caja de colisión (12 x 26) y apoya los pies
    offX: Math.floor((w - 12) / 2),
    offY: h - 26,
    torso: recorte(full, 0, 0, w, legRow),
    piernaI: recorte(full, 0, legRow, split, h - legRow),
    piernaD: recorte(full, split, legRow, w - split, h - legRow)
  }, stats);
}

const CICLO_PIERNAS = [[1,-1],[0,0],[-1,0],[0,0]];

function dibujarHeroe(g, h, x, y, mirando, estado, t, parpadeo){
  g.save();
  g.translate(Math.round(x), Math.round(y));
  if(mirando < 0){ g.translate(h.w, 0); g.scale(-1,1); }

  let bob = 0, pi = [0,0], pd = [0,0];

  if(estado === "idle"){
    bob = Math.floor(t/26) % 2;            // respiración lenta
  } else if(estado === "run"){
    const f = Math.floor(t/5) % 4;
    bob = (f === 0 || f === 2) ? -1 : 0;   // rebote de carrera
    pi = CICLO_PIERNAS[f];
    pd = CICLO_PIERNAS[(f+2) % 4];
  } else if(estado === "jump"){
    pi = [1,-2]; pd = [-1,-1]; bob = -1;
  } else if(estado === "fall"){
    pi = [-1,0]; pd = [1,-1]; bob = 1;
  }

  g.drawImage(h.torso, 0, bob);
  g.drawImage(h.piernaI, pi[0], h.legRow + bob + pi[1]);
  g.drawImage(h.piernaD, h.split + pd[0], h.legRow + bob + pd[1]);

  // parpadeo: tapa la fila de los ojos con el tono de piel del personaje
  if(parpadeo && h.blink){
    g.fillStyle = h.blink.c;
    g.fillRect(h.blink.x, h.blink.y + bob, h.blink.w, 1);
  }
  g.restore();
}

  });
  d.movers.forEach(function(mv){
    m.movers.push({
      x:mv[0]*T, y:mv[1]*T, w:mv[2]*T, h:T,
      x0:mv[0]*T, y0:mv[1]*T, dist:mv[3], eje:mv[4], vel:mv[5],
      fase:Math.random()*6.28, dx:0, dy:0, tipo:"mover"
    });
  });
  d.taiyaki.forEach(function(c){
    m.monedas.push({ x:c[0]*T+2, y:c[1]*T+4, w:12, h:8, tomada:false, giro:Math.random()*6.28 });
  });
  d.enemigos.forEach(function(e){
    m.enemigos.push(crearEnemigo(e[0], e[1], e[2], e[3]));
  });
  d.peligros.forEach(function(p){
    m.peligros.push({ x:p[0]*T, y:p[1]*T+8, w:T, h:8 });
  });
  (d.controles || []).forEach(function(c){
    m.controles.push({ x:c[0]*T, y:c[1]*T - 26, w:12, h:26, fila:c[1], activo:false });
  });
  if(d.jefe){
    m.jefe = {
      x:d.jefe[0]*T, y:d.jefe[1]*T - JEFA.h, w:JEFA.w, h:JEFA.h,
      vida:JEFA.vidaMax, vx:0, vy:0, t:0, invul:0, enSuelo:false,
      mirando:-1, activa:false, derrotada:false, salida:0, disparo:0
    };
  }

  mundo = m;
  particulas = [];
  reaparecer();
  refrescarHUD();
}

function crearEnemigo(col, fila, rango, tipo){
  const cfg = TIPOS_ENEMIGO[tipo];
  const spr = cfg.spr ? SPR[cfg.spr] : null;
  const w = cfg.w || spr.width;
  const h = cfg.h || spr.height;
  const x = col*T;
  const base = fila*T - h;               // apoyado sobre la fila indicada
  return {
    tipo:tipo, cfg:cfg, spr:spr,
    spr2: cfg.spr2 ? SPR[cfg.spr2] : null,
    x:x, y:base, w:w, h:h, base:base, x0:x, y0:base,
    min:x - rango*T, max:x + rango*T + w,
    vx:(cfg.vel || 0) * (Math.random() < 0.5 ? -1 : 1),
    vy:0, vivo:true, t:Math.floor(Math.random()*100)
  };
}

function refrescarHUD(){
  ui.nivel.textContent = nivelIdx + 1;
  ui.monedas.textContent = monedasTotal;
  ui.vidas.textContent = vidas;
  ui.char.textContent = HEROES[jugador.heroe].nombre;
}

function reaparecer(){
  const d = mundo.def;
  const cp = mundo.control >= 0 ? mundo.controles[mundo.control] : null;
  jugador.x = cp ? cp.x : d.inicio[0]*T;
  jugador.y = cp ? cp.y : d.inicio[1]*T;
  jugador.vx = 0; jugador.vy = 0;
  jugador.mirando = 1;
  jugador.saltosUsados = 0;
  jugador.invul = 90;
  jugador.muerto = 0;
  jugador.plataforma = null;
  ajustarCamara(true);
}

/* Muerte con vidas restantes: no se recarga el nivel entero, sólo se
   devuelve todo a su sitio y la hermana vuelve al último punto de control. */
function reiniciarDesdeControl(){
  mundo.enemigos.forEach(function(e){
    e.vivo = true;
    e.x = e.x0; e.y = e.y0; e.base = e.y0;
    e.vy = 0; e.t = 0;
    e.vx = (e.cfg.vel || 0) * (Math.random() < 0.5 ? -1 : 1);
  });
  mundo.disparos.length = 0;
  particulas = [];
  const j = mundo.jefe;
  if(j && !j.derrotada){
    j.x = mundo.def.jefe[0]*T; j.y = mundo.def.jefe[1]*T - JEFA.h;
    j.vida = JEFA.vidaMax; j.vx = 0; j.vy = 0; j.t = 0;
    j.invul = 0; j.activa = false; j.enSuelo = false;
  }
  mundo.introJefe = 0;
  reaparecer();
}

/* ============================================================
   5. AUDIO (bleeps sintetizados)
   ============================================================ */

let AC = null;
function audio(){
  if(!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ AC = false; }
  }
  return AC;
}
function bleep(freq, dur, tipo, vol){
  const ac = audio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo || "square";
  o.frequency.setValueAtTime(freq, ac.currentTime);
  g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function sfxSalto(){ const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type="square"; o.frequency.setValueAtTime(320,ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(760,ac.currentTime+0.12);
  g.gain.setValueAtTime(0.05,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.16);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+0.17);
}
function sfxMoneda(){ bleep(1050,0.08,"square",0.04); setTimeout(function(){bleep(1450,0.09,"square",0.04);},60); }
function sfxDano(){ bleep(160,0.28,"sawtooth",0.06); }
function sfxStomp(){ bleep(220,0.1,"triangle",0.06); setTimeout(function(){bleep(120,0.14,"triangle",0.05);},70); }
function sfxSwap(){ bleep(620,0.07,"triangle",0.05); setTimeout(function(){bleep(930,0.1,"triangle",0.05);},70); }
function sfxMeta(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){bleep(f,0.16,"square",0.05);}, i*110); }); }
function sfxControl(){ [660,880,1170].forEach(function(f,i){ setTimeout(function(){bleep(f,0.12,"triangle",0.05);}, i*80); }); }
function sfxTiro(){ bleep(300,0.09,"sawtooth",0.035); }
function sfxJefe(){ bleep(90,0.3,"square",0.05); setTimeout(function(){bleep(70,0.4,"sawtooth",0.05);},140); }
function sfxGolpeJefe(){ bleep(520,0.09,"square",0.06); setTimeout(function(){bleep(300,0.16,"sawtooth",0.05);},80); }

/* ============================================================
   6. FÍSICA Y LÓGICA
   ============================================================ */

const GRAV = 0.52, CAIDA_MAX = 9.5;

function solapan(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function todosSolidos(){
  return mundo.solidos.concat(mundo.movers);
}

function actualizar(){
  tiempo++;
  if(sacudida > 0) sacudida--;

  // --- plataformas móviles ---
  mundo.movers.forEach(function(m){
    m.fase += m.vel * 0.02;
    const off = Math.sin(m.fase) * (m.dist/2);
    const nx = m.eje === "x" ? m.x0 + off : m.x0;
    const ny = m.eje === "y" ? m.y0 + off : m.y0;
    m.dx = nx - m.x; m.dy = ny - m.y;
    m.x = nx; m.y = ny;
  });

  if(jugador.muerto > 0){
    jugador.muerto--;
    jugador.vy = Math.min(jugador.vy + GRAV, CAIDA_MAX);
    jugador.y += jugador.vy;
    if(jugador.muerto === 0) trasMorir();
    actualizarParticulas();
    return;
  }

  const h = HEROES[jugador.heroe];

  // --- entrada horizontal ---
  const izq = teclas.izq, der = teclas.der;
  const acel = jugador.enSuelo ? 0.55 : 0.32;
  const roce = jugador.enSuelo ? 0.72 : 0.9;

  if(izq && !der){ jugador.vx -= acel; jugador.mirando = -1; }
  else if(der && !izq){ jugador.vx += acel; jugador.mirando = 1; }
  else { jugador.vx *= roce; if(Math.abs(jugador.vx) < 0.06) jugador.vx = 0; }

  jugador.vx = Math.max(-h.vel, Math.min(h.vel, jugador.vx));

  // --- arrastre de plataforma móvil ---
  if(jugador.plataforma){
    jugador.x += jugador.plataforma.dx;
    jugador.y += jugador.plataforma.dy;
  }

  // --- salto con coyote time y buffer ---
  if(jugador.coyote > 0) jugador.coyote--;
  if(jugador.buffer > 0) jugador.buffer--;

  const puedeSaltar = (jugador.enSuelo || jugador.coyote > 0 || jugador.saltosUsados < h.saltosMax);
  if(jugador.buffer > 0 && puedeSaltar){
    jugador.vy = -h.salto;
    jugador.saltosUsados++;
    jugador.enSuelo = false;
    jugador.coyote = 0;
    jugador.buffer = 0;
    sfxSalto();
    polvo(jugador.x + jugador.w/2, jugador.y + jugador.h, 5, h.aura);
  }
  // salto variable: soltar el botón corta el impulso
  if(!teclas.salto && jugador.vy < -3) jugador.vy *= 0.86;

  jugador.vy = Math.min(jugador.vy + GRAV, CAIDA_MAX);

  // --- colisiones eje X ---
  jugador.x += jugador.vx;
  const solidos = todosSolidos();
  for(let i=0;i<solidos.length;i++){
    const s = solidos[i];
    if(!solapan(jugador, s)) continue;
    if(jugador.vx > 0) jugador.x = s.x - jugador.w;
    else if(jugador.vx < 0) jugador.x = s.x + s.w;
    jugador.vx = 0;
  }
  jugador.x = Math.max(0, Math.min(mundo.ancho - jugador.w, jugador.x));

  // --- colisiones eje Y ---
  const estabaEnSuelo = jugador.enSuelo;
  jugador.enSuelo = false;
  jugador.plataforma = null;
  jugador.y += jugador.vy;
  for(let i=0;i<solidos.length;i++){
    const s = solidos[i];
    if(!solapan(jugador, s)) continue;
    if(jugador.vy > 0){
      jugador.y = s.y - jugador.h;
      jugador.enSuelo = true;
      jugador.saltosUsados = 0;
      if(s.tipo === "mover") jugador.plataforma = s;
      if(!estabaEnSuelo && jugador.vy > 6) polvo(jugador.x + jugador.w/2, jugador.y + jugador.h, 6, "#ffffff");
    } else if(jugador.vy < 0){
      jugador.y = s.y + s.h;
    }
    jugador.vy = 0;
  }
  if(jugador.enSuelo) jugador.coyote = 8;

  // --- caída al vacío ---
  if(jugador.y > mundo.alto + 40){ morir(); return; }

  if(jugador.invul > 0) jugador.invul--;

  // --- taiyaki ---
  mundo.monedas.forEach(function(c){
    if(c.tomada) return;
    c.giro += 0.12;
    if(solapan(jugador, c)){
      c.tomada = true;
      monedasTotal++;
      sfxMoneda();
      chispa(c.x + 6, c.y + 4, "#ffd447");
      refrescarHUD();
    }
  });

  // --- puntos de control ---
  if(mundo.avisoControl > 0) mundo.avisoControl--;
  for(let i=0;i<mundo.controles.length;i++){
    const cp = mundo.controles[i];
    if(cp.activo || !solapan(jugador, cp)) continue;
    cp.activo = true;
    if(i > mundo.control) mundo.control = i;
    mundo.avisoControl = 100;
    sfxControl();
    chispa(cp.x + 6, cp.y + 4, "#ff85b0");
    polvo(cp.x + 6, cp.y + 22, 8, "#ffd447");
  }

  actualizarEnemigos();
  if(jugador.muerto > 0){ actualizarParticulas(); return; }

  actualizarDisparos();
  if(jugador.muerto > 0){ actualizarParticulas(); return; }

  if(mundo.jefe) actualizarJefe();
  if(jugador.muerto > 0){ actualizarParticulas(); return; }

  // --- obstáculos peligrosos del suelo ---
  for(let i=0;i<mundo.peligros.length;i++){
    if(jugador.invul === 0 && solapan(jugador, mundo.peligros[i])){ morir(); return; }
  }

  // --- meta ---
  if(mundo.metaAbierta && solapan(jugador, mundo.meta)){ completarNivel(); return; }

  actualizarParticulas();
  ajustarCamara(false);
}

/* ---------- enemigos ---------- */

function actualizarEnemigos(){
  for(let i=0;i<mundo.enemigos.length;i++){
    const e = mundo.enemigos[i];
    if(!e.vivo) continue;
    e.t++;
    const c = e.cfg;

    if(c.mov === "patrulla" || c.mov === "rebota" || c.mov === "vuela"){
      e.x += e.vx;
      if(e.x < e.min){ e.x = e.min; e.vx = Math.abs(e.vx); }
      if(e.x + e.w > e.max){ e.x = e.max - e.w; e.vx = -Math.abs(e.vx); }
    }
    if(c.mov === "rebota"){
      e.vy += 0.42;
      e.y += e.vy;
      if(e.y >= e.base){ e.y = e.base; e.vy = -(c.rebote || 5); }
    } else if(c.mov === "vuela"){
      e.y = e.base + Math.sin(e.t * 0.06) * (c.amp || 20);
    } else if(c.mov === "quieto"){
      e.mirando = (jugador.x < e.x) ? -1 : 1;
    }

    if(c.lanza && e.t % c.lanza.periodo === 0 && cercaDeCamara(e, 40)) disparar(e);

    if(!solapan(jugador, e)) continue;

    const pisando = jugador.vy > 1 && (jugador.y + jugador.h) < e.y + e.h * 0.6;
    if(pisando && c.pisable){
      e.vivo = false;
      jugador.vy = -6.4;
      jugador.saltosUsados = 0;
      sfxStomp();
      chispa(e.x + e.w/2, e.y + e.h/2, "#ff4d6d");
      sacudida = 6;
    } else if(jugador.invul === 0){
      morir();
      return;
    }
  }
}

function cercaDeCamara(o, margen){
  const x = o.x - mundo.camX;
  return x > -margen && x < VW + margen;
}

/* ---------- ataques (balones, cuadernos, rayos) ---------- */

function disparar(e){
  const dir = (jugador.x < e.x) ? -1 : 1;
  const t = e.cfg.lanza;
  mundo.disparos.push({
    x: e.x + e.w/2 - 4, y: e.y + 6, w:8, h:8,
    vx: dir * t.vel, vy: -1.4, grav: 0.06,
    tipo: t.tipo, giro: 0, vida: 260
  });
  sfxTiro();
}

function dispararJefa(j, ang, vel){
  mundo.disparos.push({
    x: j.x + j.w/2 - 5, y: j.y + 14, w:10, h:10,
    vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, grav: 0,
    tipo:"rayo", giro:0, vida:300
  });
}

function actualizarDisparos(){
  const solidos = todosSolidos();
  for(let i=mundo.disparos.length-1;i>=0;i--){
    const p = mundo.disparos[i];
    p.vy += p.grav;
    p.x += p.vx; p.y += p.vy;
    p.giro += 0.22;
    p.vida--;

    let fuera = p.vida <= 0 || p.y > mundo.alto + 30 ||
                p.x < -40 || p.x > mundo.ancho + 40;
    if(!fuera){
      for(let k=0;k<solidos.length;k++){
        if(solapan(p, solidos[k])){
          if(p.tipo === "balon" && p.vy > 0 && p.y + p.h < solidos[k].y + 10){
            // el balón pica en el suelo y sigue
            p.y = solidos[k].y - p.h; p.vy = -Math.abs(p.vy) * 0.72;
            if(Math.abs(p.vy) < 1.2){ fuera = true; }
          } else fuera = true;
          break;
        }
      }
    }
    if(fuera){
      chispa(p.x + p.w/2, p.y + p.h/2, p.tipo === "rayo" ? "#c9a0ff" : "#ffd8a0");
      mundo.disparos.splice(i,1);
      continue;
    }
    if(jugador.invul === 0 && solapan(jugador, p)){
      mundo.disparos.splice(i,1);
      morir();
      return;
    }
  }
}

/* ---------- la jefa alienígena ---------- */

function cajaJefa(j){
  return { x:j.x + JEFA.hitX, y:j.y, w:JEFA.hitW, h:j.h };
}

function actualizarJefe(){
  const j = mundo.jefe;
  j.t++;

  if(j.derrotada){
    j.salida++;
    if(j.salida === 1){
      mundo.metaAbierta = true;
      sfxMeta();
    }
    if(j.salida < 40 && j.salida % 5 === 0){
      chispa(j.x + j.w/2 + (Math.random()-0.5)*20, j.y + 10 + Math.random()*16, "#c9a0ff");
    }
    j.y += 0.6;   // se desinfla hacia el suelo
    return;
  }

  if(!j.activa){
    if(Math.abs((jugador.x + 6) - (j.x + j.w/2)) < 230){
      j.activa = true;
      sfxJefe();
      mundo.introJefe = 130;
    } else {
      return;
    }
  }

  if(j.invul > 0) j.invul--;

  j.mirando = (jugador.x + 6 < j.x + j.w/2) ? -1 : 1;

  // salto hacia la hermana cada tanto
  if(j.enSuelo && j.t % 82 === 0){
    j.vy = -7.4;
    j.vx = j.mirando * 1.15;
    j.enSuelo = false;
  }

  // ráfaga de rayos
  if(j.t % 150 === 0){
    const base = j.mirando < 0 ? Math.PI : 0;
    for(let k=-1;k<=1;k++) dispararJefa(j, base + k*0.34, 2.5);
    sfxTiro();
  }

  j.vy = Math.min(j.vy + 0.5, CAIDA_MAX);
  j.x += j.vx;
  j.y += j.vy;
  j.vx *= 0.96;

  // suelo y paredes de la habitación
  const solidos = todosSolidos();
  const caja = cajaJefa(j);
  j.enSuelo = false;
  for(let k=0;k<solidos.length;k++){
    const s = solidos[k];
    if(!solapan(caja, s)) continue;
    if(j.vy > 0 && caja.y + caja.h - j.vy <= s.y + 2){
      j.y = s.y - j.h; j.vy = 0; j.enSuelo = true;
    } else if(j.vy < 0 && caja.y - j.vy >= s.y + s.h - 2){
      j.y = s.y + s.h; j.vy = 0;
    } else {
      j.vx = -j.vx;
      j.x += j.vx * 2;
    }
    caja.x = j.x + JEFA.hitX; caja.y = j.y;
  }
  j.x = Math.max(0, Math.min(mundo.ancho - j.w, j.x));

  // choque con la hermana
  if(!solapan(jugador, cajaJefa(j))) return;
  const pisando = jugador.vy > 1 && (jugador.y + jugador.h) < j.y + 14;
  if(pisando && j.invul === 0){
    j.vida--;
    j.invul = 64;
    jugador.vy = -7.2;
    jugador.saltosUsados = 0;
    sacudida = 12;
    sfxGolpeJefe();
    chispa(j.x + j.w/2, j.y + 12, "#3fd4c8");
    j.vx = -j.mirando * 2.2;
    if(j.vida <= 0){
      j.derrotada = true;
      j.salida = 0;
      polvo(j.x + j.w/2, j.y + j.h/2, 26, "#c9a0ff");
      sacudida = 20;
    }
  } else if(jugador.invul === 0 && j.invul === 0){
    morir();
  }
}

function ajustarCamara(inmediato){
  const objX = jugador.x + jugador.w/2 - VW/2;
  const maxX = Math.max(0, mundo.ancho - VW);
  const destX = Math.max(0, Math.min(maxX, objX));

  const maxY = Math.max(0, mundo.alto - VH);
  const objY = jugador.y + jugador.h/2 - VH/2 + 30;
  const destY = Math.max(0, Math.min(maxY, objY));

  if(inmediato){ mundo.camX = destX; mundo.camY = destY; }
  else {
    mundo.camX += (destX - mundo.camX) * 0.12;
    mundo.camY += (destY - mundo.camY) * 0.09;
  }
}

function morir(){
  if(jugador.muerto > 0) return;
  jugador.muerto = 46;
  jugador.vy = -6;
  jugador.vx = -jugador.mirando * 1.6;
  jugador.invul = 999;
  sacudida = 12;
  sfxDano();
  polvo(jugador.x + jugador.w/2, jugador.y + jugador.h/2, 12, HEROES[jugador.heroe].aura);
}

function trasMorir(){
  vidas--;
  refrescarHUD();
  if(vidas <= 0){
    modo = "gameover";
    mostrarOverlay("Se acabaron las vidas",
      "Juntaste " + monedasTotal + " taiyaki antes de caer. Vuelve a intentarlo desde el nivel 1.",
      "Reintentar", false, true);
  } else if(mundo.control >= 0){
    // hay punto de control: vuelve ahí y conserva los taiyaki ya recogidos
    reiniciarDesdeControl();
  } else {
    // sin punto de control todavía: reinicia el nivel desde el principio
    descontarTaiyakiDelNivel();
    cargarNivel(nivelIdx);
  }
}

function completarNivel(){
  sfxMeta();
  modo = "nivelListo";
  if(nivelIdx >= NIVELES.length - 1){
    modo = "victoria";
    mostrarOverlay("¡En casa por fin!",
      "Mikan y Yami vencieron a la alienígena y llegaron a su cuarto con " +
      monedasTotal + " taiyaki y " + vidas + " vidas.",
      "Jugar de nuevo", false, true);
  } else {
    mostrarOverlay("Nivel " + (nivelIdx+1) + " completado",
      "Siguiente: " + NIVELES[nivelIdx+1].nombre + ". Llevas " + monedasTotal + " taiyaki.",
      "Continuar", false, true);
  }
}

function descontarTaiyakiDelNivel(){
  if(!mundo || !mundo.monedas) return;
  monedasTotal -= mundo.monedas.filter(function(c){ return c.tomada; }).length;
  if(monedasTotal < 0) monedasTotal = 0;
}

/* ---------- partículas ---------- */

function polvo(x, y, n, color){
  for(let i=0;i<n;i++){
    particulas.push({ x:x, y:y, vx:(Math.random()-0.5)*2.4, vy:-Math.random()*2.2,
      vida:20+Math.random()*16, max:36, c:color, s:1+Math.random()*1.6 });
  }
}
function chispa(x, y, color){
  for(let i=0;i<10;i++){
    const a = Math.random()*Math.PI*2, v = 1 + Math.random()*2.2;
    particulas.push({ x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 0.6,
      vida:18+Math.random()*14, max:32, c:color, s:1+Math.random()*1.4 });
  }
}
function actualizarParticulas(){
  for(let i=particulas.length-1;i>=0;i--){
    const p = particulas[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.vx *= 0.97; p.vida--;
    if(p.vida <= 0) particulas.splice(i,1);
  }
}

/* ============================================================
   7. RENDER
   ============================================================ */

const nubes = [];
for(let i=0;i<8;i++){
  nubes.push({ x:Math.random()*1400, y:20+Math.random()*70, w:26+Math.random()*30 });
}

function rep(x, periodo){ return ((x % periodo) + periodo) % periodo; }

/* ---------- fondos por escenario ---------- */

function fondo(d, camX, camY){
  const tm = TEMAS[d.tema];
  if(tm.interior) fondoInterior(d, tm, camX, camY);
  else fondoExterior(d, tm, camX, camY);
  bajoSuelo(d, tm, camX, camY);
}

/* Lo que se ve por los huecos del piso: calzada en la calle, oscuridad dentro. */
function bajoSuelo(d, tm, camX, camY){
  const y = Math.round(d.sueloFila*T - camY);
  if(y > VH) return;
  if(tm.interior){
    ctx.fillStyle = "#1c1522";
    ctx.fillRect(0, y, VW, VH - y);
    ctx.fillStyle = "rgba(255,255,255,.05)";
    ctx.fillRect(0, y, VW, 2);
  } else {
    ctx.fillStyle = "#3c414c";
    ctx.fillRect(0, y, VW, VH - y);
    ctx.fillStyle = "#2f333c";
    ctx.fillRect(0, y, VW, 4);
    ctx.fillStyle = "#d8c060";
    for(let i=-1;i<20;i++){
      const x = Math.round(i*40 - rep(camX,40));
      ctx.fillRect(x, y + 22, 18, 3);
    }
  }
}

function fondoInterior(d, tm, camX, camY){
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, tm.pared[0]); g.addColorStop(1, tm.pared[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);

  const suelo = d.sueloFila*T - camY;

  if(d.tema === "escuela") decoradoEscuela(tm, camX, camY, suelo);
  else if(d.tema === "tren") decoradoTren(tm, camX, camY, suelo);
  else decoradoCasa(tm, camX, camY, suelo);

  // zócalo a lo largo de la pared
  ctx.fillStyle = tm.zocalo;
  ctx.globalAlpha = 0.6;
  for(let f=0; f<d.filas; f++){
    const y = f*T - camY;
    if(y > -20 && y < VH+20 && (f === d.sueloFila || f === 16 || f === 11)){
      ctx.fillRect(0, y-4, VW, 4);
    }
  }
  ctx.globalAlpha = 1;
}

function decoradoEscuela(tm, camX, camY, suelo){
  const px = camX*0.55;
  // ventanales
  for(let i=-1;i<7;i++){
    const x = Math.round(i*110 - rep(px,110));
    const y = Math.round(46 - camY*0.35);
    ctx.fillStyle = tm.marco; ctx.fillRect(x, y, 76, 62);
    ctx.fillStyle = tm.ventana; ctx.fillRect(x+4, y+4, 68, 54);
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillRect(x+8, y+8, 22, 46);
    ctx.fillStyle = tm.marco;
    ctx.fillRect(x+36, y+4, 4, 54); ctx.fillRect(x+4, y+28, 68, 4);
  }
  // pizarrón y carteles
  for(let i=-1;i<4;i++){
    const x = Math.round(i*260 - rep(camX*0.55,260) + 130);
    const y = Math.round(52 - camY*0.35);
    ctx.fillStyle = "#6b4a2f"; ctx.fillRect(x, y, 96, 50);
    ctx.fillStyle = tm.pizarra; ctx.fillRect(x+3, y+3, 90, 44);
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(x+10, y+12, 40, 2); ctx.fillRect(x+10, y+20, 58, 2);
    ctx.fillRect(x+10, y+28, 30, 2);
  }
  // casilleros bajo la ventana
  ctx.fillStyle = tm.detalle;
  for(let i=-1;i<12;i++){
    const x = Math.round(i*44 - rep(camX*0.55,44));
    ctx.fillRect(x, suelo-46, 40, 46);
    ctx.fillStyle = "rgba(0,0,0,.14)";
    ctx.fillRect(x+18, suelo-46, 2, 46);
    ctx.fillRect(x+4, suelo-30, 6, 3); ctx.fillRect(x+26, suelo-30, 6, 3);
    ctx.fillStyle = tm.detalle;
  }
}

function decoradoTren(tm, camX, camY, suelo){
  // ventanillas con el paisaje corriendo
  for(let i=-1;i<8;i++){
    const x = Math.round(i*92 - rep(camX*0.5,92));
    const y = Math.round(52 - camY*0.3);
    ctx.fillStyle = tm.marco; ctx.fillRect(x, y, 74, 56);
    ctx.fillStyle = tm.ventana; ctx.fillRect(x+4, y+4, 66, 48);
    // paisaje veloz
    ctx.save();
    ctx.beginPath(); ctx.rect(x+4, y+4, 66, 48); ctx.clip();
    ctx.fillStyle = "#8fb98a";
    ctx.fillRect(x+4, y+34, 66, 18);
    for(let k=0;k<5;k++){
      const bx = x + 4 + rep(k*26 - tiempo*3.2, 92);
      ctx.fillStyle = "#5f7f5c";
      ctx.fillRect(Math.round(bx), y+18, 8, 18);
      ctx.fillStyle = "#c8d8e8";
      ctx.fillRect(Math.round(bx)+2, y+10, 4, 8);
    }
    ctx.restore();
  }
  // agarraderas del techo
  ctx.strokeStyle = "#98a4b6"; ctx.lineWidth = 2;
  for(let i=-1;i<18;i++){
    const x = Math.round(i*34 - rep(camX*0.9,34));
    const y = Math.round(6 - camY*0.5);
    const osc = Math.sin(tiempo*0.05 + i)*2;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + osc, y+20); ctx.stroke();
    ctx.strokeRect(x + osc - 4, y+20, 8, 8);
  }
  ctx.lineWidth = 1;
  // banda de piso del vagón
  ctx.fillStyle = tm.detalle;
  ctx.fillRect(0, suelo-8, VW, 8);
}

function decoradoCasa(tm, camX, camY, suelo){
  // papel tapiz a rayas
  ctx.fillStyle = "rgba(255,255,255,.16)";
  for(let i=-1;i<24;i++){
    const x = Math.round(i*24 - rep(camX*0.4,24));
    ctx.fillRect(x, 0, 10, VH);
  }
  // cuadros y lámparas
  for(let i=-1;i<8;i++){
    const x = Math.round(i*130 - rep(camX*0.4,130));
    const y = Math.round(40 - camY*0.35);
    ctx.fillStyle = "#7a5442"; ctx.fillRect(x, y, 40, 30);
    ctx.fillStyle = "#e8d8c0"; ctx.fillRect(x+3, y+3, 34, 24);
    ctx.fillStyle = "#b9a0d8"; ctx.fillRect(x+8, y+14, 24, 10);
    ctx.fillStyle = "#f0c070";
    ctx.beginPath(); ctx.arc(x+90, y+6, 7, 0, 6.3); ctx.fill();
    ctx.globalAlpha = 0.2;
    ctx.beginPath(); ctx.arc(x+90, y+6, 16, 0, 6.3); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function fondoExterior(d, tm, camX, camY){
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, tm.cielo[0]); g.addColorStop(1, tm.cielo[1]);
  ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);

  ctx.fillStyle = tm.sol;
  ctx.beginPath(); ctx.arc(408 - camX*0.04, 40 - camY*0.03, 20, 0, 6.3); ctx.fill();

  nubes.forEach(function(n, i){
    const nx = rep(n.x - camX*0.16 - tiempo*0.1, VW+200) - 100;
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillRect(Math.round(nx), Math.round(n.y - camY*0.03), n.w, 7);
    ctx.fillRect(Math.round(nx+7), Math.round(n.y - 5 - camY*0.03), n.w-16, 6);
  });

  const suelo = d.sueloFila*T - camY;

  if(d.tema === "barrio"){
    // torres lejanas
    for(let i=-1;i<12;i++){
      const x = Math.round(i*72 - rep(camX*0.22,72));
      const alt = 70 + ((i*37)%5)*16;
      ctx.fillStyle = tm.lejos;
      ctx.fillRect(x, suelo-alt, 56, alt);
      ctx.fillStyle = "rgba(255,255,255,.28)";
      for(let a=0;a<4;a++) for(let b=0;b<Math.floor(alt/22);b++)
        ctx.fillRect(x+7+a*12, suelo-alt+10+b*20, 7, 9);
    }
    // fachadas de tiendas con toldo y cartel
    for(let i=-1;i<14;i++){
      const x = Math.round(i*88 - rep(camX*0.48,88));
      const alt = 96;
      ctx.fillStyle = tm.cerca; ctx.fillRect(x, suelo-alt, 74, alt);
      ctx.fillStyle = tm.tejado; ctx.fillRect(x-3, suelo-alt-6, 80, 8);
      ctx.fillStyle = tm.toldo;
      for(let a=0;a<5;a++){
        ctx.fillStyle = a%2 ? "#f2f2f2" : tm.toldo;
        ctx.fillRect(x+4+a*14, suelo-40, 14, 12);
      }
      ctx.fillStyle = "#2b2f3d"; ctx.fillRect(x+10, suelo-28, 22, 28);
      ctx.fillStyle = "#f6d98a"; ctx.fillRect(x+40, suelo-26, 26, 20);
      ctx.fillStyle = "#e8605c"; ctx.fillRect(x+44, suelo-72, 8, 34);
      ctx.fillStyle = "#fff"; ctx.fillRect(x+46, suelo-68, 4, 6);
      ctx.fillRect(x+46, suelo-58, 4, 6); ctx.fillRect(x+46, suelo-48, 4, 6);
    }
  } else {
    // casas bajas del barrio residencial
    for(let i=-1;i<12;i++){
      const x = Math.round(i*84 - rep(camX*0.24,84));
      ctx.fillStyle = tm.lejos;
      ctx.fillRect(x, suelo-60, 64, 60);
      ctx.fillStyle = tm.tejado;
      ctx.beginPath();
      ctx.moveTo(x-6, suelo-60); ctx.lineTo(x+32, suelo-84); ctx.lineTo(x+70, suelo-60);
      ctx.closePath(); ctx.fill();
    }
    for(let i=-1;i<14;i++){
      const x = Math.round(i*96 - rep(camX*0.5,96));
      ctx.fillStyle = tm.cerca; ctx.fillRect(x, suelo-72, 74, 72);
      ctx.fillStyle = tm.tejado;
      ctx.beginPath();
      ctx.moveTo(x-8, suelo-72); ctx.lineTo(x+37, suelo-100); ctx.lineTo(x+82, suelo-72);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f6e8c8"; ctx.fillRect(x+10, suelo-58, 20, 18);
      ctx.fillRect(x+44, suelo-58, 20, 18);
      ctx.fillStyle = "#6b4a2f"; ctx.fillRect(x+30, suelo-30, 16, 30);
      // arbolito
      ctx.fillStyle = "#6b4a2f"; ctx.fillRect(x+86, suelo-26, 5, 26);
      ctx.fillStyle = tm.toldo;
      ctx.beginPath(); ctx.arc(x+88, suelo-34, 14, 0, 6.3); ctx.fill();
    }
  }

  // postes y cables
  ctx.strokeStyle = "rgba(40,40,60,.5)"; ctx.lineWidth = 1;
  for(let i=-1;i<10;i++){
    const x = Math.round(i*140 - rep(camX*0.62,140));
    ctx.fillStyle = "#6a6a72";
    ctx.fillRect(x, suelo-92, 4, 92);
    ctx.fillRect(x-8, suelo-88, 20, 3);
    ctx.beginPath();
    ctx.moveTo(x+2, suelo-86);
    ctx.quadraticCurveTo(x+72, suelo-72, x+142, suelo-86);
    ctx.stroke();
  }
}

/* ---------- bloques sólidos ---------- */

function bloque(b, d, camX, camY){
  const tm = TEMAS[d.tema];
  const x = Math.round(b.x - camX), y = Math.round(b.y - camY);
  if(x > VW || x + b.w < 0 || y > VH || y + b.h < 0) return;

  if(b.tipo === "mover"){
    ctx.fillStyle = "#8a6bb8"; ctx.fillRect(x, y, b.w, b.h);
    ctx.fillStyle = "#c9a6e8"; ctx.fillRect(x, y, b.w, 3);
    ctx.fillStyle = "#4a3570"; ctx.fillRect(x, y + b.h - 3, b.w, 3);
    for(let i=4;i<b.w-4;i+=8) ctx.fillRect(x+i, y+6, 3, 3);
    return;
  }
  if(b.tipo === "prop"){ dibujarProp(b, x, y); return; }

  const esPlat = b.tipo === "plat";
  ctx.fillStyle = esPlat ? tm.plataforma : tm.piso;
  ctx.fillRect(x, y, b.w, b.h);
  ctx.fillStyle = esPlat ? tm.plataformaTop : tm.pisoTop;
  ctx.fillRect(x, y, b.w, 4);
  ctx.fillStyle = "rgba(255,255,255,.18)";
  ctx.fillRect(x, y, b.w, 1);

  ctx.fillStyle = tm.linea;
  if(d.tema === "escuela" || d.tema === "casa"){
    for(let i=0;i<b.w;i+=16) ctx.fillRect(x+i, y+4, 1, b.h-4);   // duelas de madera
    for(let j=12;j<b.h;j+=16) ctx.fillRect(x, y+j, b.w, 1);
  } else if(d.tema === "tren"){
    for(let i=0;i<b.w;i+=8) ctx.fillRect(x+i, y+6, 4, 1);
  } else {
    for(let i=0;i<b.w;i+=24) ctx.fillRect(x+i, y+4, 1, b.h-4);   // baldosas de vereda
    for(let j=14;j<b.h;j+=18) ctx.fillRect(x, y+j, b.w, 1);
  }
}

/* ---------- muebles y obstáculos ---------- */

function dibujarProp(p, x, y){
  const w = p.w, h = p.h;
  switch(p.clase){
    case "pupitre":
      ctx.fillStyle = "#c9a06a"; ctx.fillRect(x, y, w, 5);
      ctx.fillStyle = "#e0bd86"; ctx.fillRect(x, y, w, 2);
      ctx.fillStyle = "#7f8794"; ctx.fillRect(x+2, y+5, 3, h-5); ctx.fillRect(x+w-5, y+5, 3, h-5);
      ctx.fillStyle = "#9aa3b0"; ctx.fillRect(x+4, y+8, w-8, 2);
      break;
    case "silla":
      ctx.fillStyle = "#c08a4a"; ctx.fillRect(x, y+4, w, 4);
      ctx.fillStyle = "#8f6a3a"; ctx.fillRect(x, y, 3, 6);
      ctx.fillStyle = "#7f8794"; ctx.fillRect(x+2, y+8, 2, h-8); ctx.fillRect(x+w-4, y+8, 2, h-8);
      break;
    case "mesaProf":
      ctx.fillStyle = "#a9764a"; ctx.fillRect(x, y, w, 6);
      ctx.fillStyle = "#c9a06a"; ctx.fillRect(x, y, w, 2);
      ctx.fillStyle = "#8a5f38"; ctx.fillRect(x+2, y+6, w-4, h-6);
      ctx.fillStyle = "#6b4a2c"; ctx.fillRect(x+6, y+10, w-12, 2);
      break;
    case "pila":     // cuadernos apilados
      ctx.fillStyle = "#d85a6a"; ctx.fillRect(x, y+h-4, w, 4);
      ctx.fillStyle = "#5a8ad8"; ctx.fillRect(x+1, y+h-7, w-2, 3);
      ctx.fillStyle = "#e8c85a"; ctx.fillRect(x+2, y+h-10, w-4, 3);
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.fillRect(x+w-4, y+h-4, 2, 4); ctx.fillRect(x+w-5, y+h-7, 2, 3);
      break;
    case "maleta": case "maletaG":
      ctx.fillStyle = "#4a5a72"; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = "#67789a"; ctx.fillRect(x, y, w, 3);
      ctx.fillStyle = "#2f3a4c"; ctx.fillRect(x+3, y+5, w-6, 2);
      ctx.fillStyle = "#c9a06a"; ctx.fillRect(x+w/2-4, y-3, 8, 3);
      ctx.fillStyle = "#20262f"; ctx.fillRect(x+2, y+h-3, 3, 3); ctx.fillRect(x+w-5, y+h-3, 3, 3);
      break;
    case "asiento":
      ctx.fillStyle = "#3f6a9a"; ctx.fillRect(x, y+4, w, h-4);
      ctx.fillStyle = "#5a8cc0"; ctx.fillRect(x, y+4, w, 3);
      ctx.fillStyle = "#2b4a70"; ctx.fillRect(x, y+h-3, w, 3);
      for(let i=6;i<w-4;i+=10){ ctx.fillStyle="#2b4a70"; ctx.fillRect(x+i, y+8, 1, h-10); }
      ctx.fillStyle = "#98a4b6"; ctx.fillRect(x, y, 3, 5); ctx.fillRect(x+w-3, y, 3, 5);
      break;
    case "sofa":
      ctx.fillStyle = "#8a5a72"; ctx.fillRect(x, y+4, w, h-4);
      ctx.fillStyle = "#a86f8a"; ctx.fillRect(x, y+4, w, 4);
      ctx.fillStyle = "#6b4056"; ctx.fillRect(x, y+h-4, w, 4);
      ctx.fillStyle = "#a86f8a"; ctx.fillRect(x, y, 6, 8); ctx.fillRect(x+w-6, y, 6, 8);
      break;
    case "mesita":
      ctx.fillStyle = "#a9764a"; ctx.fillRect(x, y, w, 4);
      ctx.fillStyle = "#c9a06a"; ctx.fillRect(x, y, w, 2);
      ctx.fillStyle = "#8a5f38"; ctx.fillRect(x+2, y+4, 3, h-4); ctx.fillRect(x+w-5, y+4, 3, h-4);
      break;
    case "tv":
      ctx.fillStyle = "#2b2f3a"; ctx.fillRect(x, y, w, h-4);
      ctx.fillStyle = "#6fb4c9"; ctx.fillRect(x+2, y+2, w-4, h-9);
      ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(x+4, y+4, 6, h-13);
      ctx.fillStyle = "#20242c"; ctx.fillRect(x+w/2-4, y+h-4, 8, 4);
      break;
    case "cama":
      ctx.fillStyle = "#8a6a4a"; ctx.fillRect(x, y+6, w, h-6);
      ctx.fillStyle = "#e0a0b8"; ctx.fillRect(x, y+2, w, 6);
      ctx.fillStyle = "#f6f0e8"; ctx.fillRect(x+2, y-2, 14, 8);
      ctx.fillStyle = "#6b4a2c"; ctx.fillRect(x, y+h-4, w, 4);
      break;
    case "estante":
      ctx.fillStyle = "#8a5f38"; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = "#6b4a2c"; ctx.fillRect(x, y+h/2-1, w, 2);
      const libros = ["#d85a6a","#5a8ad8","#e8c85a","#6ac08a"];
      for(let i=0;i<w-6;i+=5){
        ctx.fillStyle = libros[(i/5|0) % 4];
        ctx.fillRect(x+3+i, y+2, 4, h/2-4);
        ctx.fillRect(x+3+i, y+h/2+2, 4, h/2-4);
      }
      break;
    case "banco":
      ctx.fillStyle = "#a9764a"; ctx.fillRect(x, y, w, 4);
      ctx.fillStyle = "#c9a06a"; ctx.fillRect(x, y, w, 2);
      ctx.fillStyle = "#5a5f66"; ctx.fillRect(x+3, y+4, 3, h-4); ctx.fillRect(x+w-6, y+4, 3, h-4);
      break;
    case "buzon":
      ctx.fillStyle = "#c94a4a"; ctx.fillRect(x, y, w, 10);
      ctx.fillStyle = "#e86a6a"; ctx.fillRect(x, y, w, 3);
      ctx.fillStyle = "#3a2a2a"; ctx.fillRect(x+2, y+5, w-4, 2);
      ctx.fillStyle = "#6a6a72"; ctx.fillRect(x+3, y+10, 4, h-10);
      break;
    case "cono":
      ctx.fillStyle = "#e8703a";
      ctx.beginPath(); ctx.moveTo(x+w/2, y); ctx.lineTo(x+w, y+h-3); ctx.lineTo(x, y+h-3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f6f0e8"; ctx.fillRect(x+2, y+h-9, w-4, 3);
      ctx.fillStyle = "#c9542a"; ctx.fillRect(x-1, y+h-3, w+2, 3);
      break;
    case "arbusto":
      ctx.fillStyle = "#4f8f5a";
      ctx.beginPath(); ctx.arc(x+5, y+h-5, 6, 0, 6.3);
      ctx.arc(x+w/2, y+5, 7, 0, 6.3); ctx.arc(x+w-5, y+h-5, 6, 0, 6.3); ctx.fill();
      ctx.fillRect(x, y+h-6, w, 6);
      ctx.fillStyle = "#68b072";
      ctx.fillRect(x+3, y+4, 4, 3); ctx.fillRect(x+w-8, y+7, 4, 3);
      break;
    default: // caja
      ctx.fillStyle = "#b98a52"; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = "#d6a96b"; ctx.fillRect(x, y, w, 3);
      ctx.fillStyle = "#8a6136";
      ctx.fillRect(x, y+h/2-1, w, 2); ctx.fillRect(x+w/2-1, y, 2, h);
  }
}

/* ---------- coleccionables y peligros ---------- */

function dibujarTaiyaki(c, camX, camY){
  if(c.tomada) return;
  const x = Math.round(c.x - camX);
  const y = Math.round(c.y - camY + Math.sin(tiempo*0.08 + c.giro)*1.6);
  if(x < -20 || x > VW+20) return;
  ctx.globalAlpha = 0.9;
  ctx.drawImage(SPR.taiyaki, x, y);
  ctx.globalAlpha = 1;
}

function dibujarPeligro(p, d, camX, camY){
  const x = Math.round(p.x - camX), y = Math.round(p.y - camY);
  if(x > VW || x + p.w < 0) return;
  const clase = TEMAS[d.tema].peligro;

  if(clase === "union"){          // hueco entre vagones
    ctx.fillStyle = "#20242c"; ctx.fillRect(x, y, p.w, p.h);
    ctx.fillStyle = "#3f4654";
    for(let i=0;i<p.w;i+=4) ctx.fillRect(x+i, y+2, 2, p.h-2);
    ctx.fillStyle = "rgba(120,200,255,.5)";
    if(Math.floor(tiempo/8)%2 === 0) ctx.fillRect(x+3, y, p.w-6, 2);
    return;
  }
  if(clase === "rejilla"){        // alcantarilla abierta
    ctx.fillStyle = "#22262e"; ctx.fillRect(x, y, p.w, p.h);
    ctx.fillStyle = "#5a616c";
    for(let i=1;i<p.w;i+=5) ctx.fillRect(x+i, y, 2, p.h);
    ctx.globalAlpha = 0.35; ctx.fillStyle = "#cfd8e8";
    ctx.fillRect(x+2, y - 4 - (tiempo*0.4 % 6), p.w-4, 3);
    ctx.globalAlpha = 1;
    return;
  }
  if(clase === "juguete"){        // bloques de juguete regados
    const cols = ["#d85a6a","#5a8ad8","#e8c85a","#6ac08a"];
    for(let i=0;i<3;i++){
      ctx.fillStyle = cols[(i + Math.floor(x/16)) % 4];
      ctx.fillRect(x+i*5+1, y+3, 4, 5);
      ctx.fillRect(x+i*5+2, y+1, 2, 2);
    }
    return;
  }
  // metal / reja: puntas
  const claro = clase === "reja" ? "#7f8a6a" : "#cfd8e8";
  const oscuro = clase === "reja" ? "#525a42" : "#8894ab";
  for(let i=0;i<2;i++){
    const bx = x + i*8;
    ctx.fillStyle = claro;
    ctx.beginPath(); ctx.moveTo(bx, y+8); ctx.lineTo(bx+4, y-2); ctx.lineTo(bx+8, y+8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = oscuro;
    ctx.beginPath(); ctx.moveTo(bx+4, y+8); ctx.lineTo(bx+4, y-2); ctx.lineTo(bx+8, y+8);
    ctx.closePath(); ctx.fill();
  }
}

/* ---------- puntos de control ---------- */

function dibujarControl(cp, camX, camY){
  const x = Math.round(cp.x - camX), y = Math.round(cp.y - camY);
  if(x > VW+30 || x < -30) return;
  const base = y + cp.h;
  const alto = 46;                 // el mástil sobresale por encima de la hermana
  const top = base - alto;

  if(cp.activo){
    ctx.globalAlpha = 0.14 + 0.1*Math.sin(tiempo*0.07);
    ctx.fillStyle = "#ff85b0";
    ctx.beginPath(); ctx.arc(x+4, top+8, 22, 0, 6.3); ctx.fill();
    ctx.globalAlpha = 1;
  }
  // peana y mástil
  ctx.fillStyle = "#4a4450";
  ctx.fillRect(x-3, base-3, 14, 3);
  ctx.fillStyle = "#6a6478";
  ctx.fillRect(x-1, base-5, 10, 2);
  ctx.fillStyle = "#7a7488";
  ctx.fillRect(x+2, top, 3, alto-4);
  ctx.fillStyle = "#a9a3b8";
  ctx.fillRect(x+2, top, 1, alto-4);

  // banderín: ondea cuando está activo
  const onda = cp.activo ? Math.sin(tiempo*0.12)*1.5 : 0;
  ctx.fillStyle = cp.activo ? "#ff3d81" : "#5f5a6e";
  ctx.beginPath();
  ctx.moveTo(x+5, top+1);
  ctx.lineTo(x+20 + onda, top+7);
  ctx.lineTo(x+5, top+13);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = cp.activo ? "#ffd447" : "#3f3b4c";
  ctx.fillRect(x+8, top+5, 3, 3);
  if(cp.activo){
    const chispa = Math.floor(tiempo/6) % 4;
    ctx.fillStyle = "#ffeaa0";
    ctx.fillRect(x + 14 - chispa*3, top - 4 - chispa*2, 2, 2);
  }
}

/* ---------- enemigos ---------- */

function dibujarEnemigo(e, camX, camY){
  if(!e.vivo) return;
  const x = Math.round(e.x - camX), y = Math.round(e.y - camY);
  if(x > VW+60 || x + e.w < -60) return;

  // sombra (los que vuelan no la proyectan bajo sus alas)
  if(e.cfg.mov !== "vuela"){
    ctx.globalAlpha = 0.22; ctx.fillStyle = "#000";
    ctx.fillRect(x+2, Math.round(e.base - camY) + e.h - 2, e.w-4, 2);
    ctx.globalAlpha = 1;
  }

  if(e.cfg.proc === "auto"){ dibujarAuto(e, x, y); return; }
  if(e.cfg.proc === "balon"){ dibujarBalon(x, y, e.w, e.t); return; }
  if(e.cfg.proc === "robot"){ dibujarRobot(e, x, y); return; }

  let img = e.spr;
  if(e.spr2 && Math.floor(e.t/7) % 2 === 0) img = e.spr2;

  ctx.save();
  ctx.translate(x, y);
  const dir = e.cfg.mov === "quieto" ? (e.mirando || 1) : (e.vx < 0 ? -1 : 1);
  if(dir < 0){ ctx.translate(e.w, 0); ctx.scale(-1,1); }
  // los que caminan dan un pequeño paso arriba/abajo
  const paso = (e.cfg.mov === "patrulla" && Math.floor(e.t/9) % 2 === 0) ? -1 : 0;
  ctx.drawImage(img, 0, paso);
  ctx.restore();

  if(e.cfg.lanza){
    // burbuja de aviso antes de lanzar
    const falta = e.cfg.lanza.periodo - (e.t % e.cfg.lanza.periodo);
    if(falta < 26){
      ctx.globalAlpha = 0.5 + 0.5*Math.sin(tiempo*0.4);
      ctx.fillStyle = "#ffd447";
      ctx.fillRect(x + e.w/2 - 2, y - 10, 4, 6);
      ctx.fillRect(x + e.w/2 - 2, y - 3, 4, 2);
      ctx.globalAlpha = 1;
    }
  }
}

function dibujarAuto(e, x, y){
  const w = e.w, h = e.h;
  const der = e.vx > 0;
  ctx.save();
  ctx.translate(x, y);
  if(!der){ ctx.translate(w, 0); ctx.scale(-1,1); }
  ctx.fillStyle = "#c94a5a"; ctx.fillRect(0, 8, w, h-12);
  ctx.fillStyle = "#e06a78"; ctx.fillRect(0, 8, w, 3);
  ctx.fillStyle = "#a83848"; ctx.fillRect(0, h-8, w, 3);
  // cabina
  ctx.fillStyle = "#c94a5a"; ctx.fillRect(10, 1, w-22, 8);
  ctx.fillStyle = "#a8d8ea"; ctx.fillRect(12, 2, 12, 6); ctx.fillRect(26, 2, 12, 6);
  // faros y ruedas
  ctx.fillStyle = "#ffe9a0"; ctx.fillRect(w-4, 11, 4, 4);
  ctx.fillStyle = "#e0605c"; ctx.fillRect(0, 11, 3, 4);
  ctx.fillStyle = "#1c1f26";
  const gira = Math.floor(e.t/4) % 2;
  ctx.fillRect(7, h-6, 9, 6); ctx.fillRect(w-17, h-6, 9, 6);
  ctx.fillStyle = "#8a8f99";
  ctx.fillRect(9+gira, h-4, 4, 2); ctx.fillRect(w-15+gira, h-4, 4, 2);
  ctx.restore();
}

function dibujarBalon(x, y, s, t){
  const r = s/2;
  ctx.fillStyle = "#f2f2f2";
  ctx.beginPath(); ctx.arc(x+r, y+r, r, 0, 6.3); ctx.fill();
  ctx.fillStyle = "#c9c9cf";
  ctx.beginPath(); ctx.arc(x+r, y+r+1, r-1, 0.6, 2.6); ctx.fill();
  ctx.fillStyle = "#25272e";
  const a = t*0.16;
  for(let i=0;i<3;i++){
    const ang = a + i*2.09;
    ctx.beginPath();
    ctx.arc(x+r + Math.cos(ang)*r*0.45, y+r + Math.sin(ang)*r*0.45, 1.8, 0, 6.3);
    ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x+r, y+r, 2, 0, 6.3); ctx.fill();
}

function dibujarRobot(e, x, y){
  const w = e.w, h = e.h;
  ctx.fillStyle = "#5a6b7a"; ctx.fillRect(x, y+2, w, h-2);
  ctx.fillStyle = "#7f93a6"; ctx.fillRect(x+2, y, w-4, 4);
  ctx.fillStyle = "#2b323c"; ctx.fillRect(x, y+h-2, w, 2);
  const on = Math.floor(e.t/12) % 2 === 0;
  ctx.fillStyle = on ? "#6ff0c0" : "#2f7a68";
  ctx.fillRect(x + (e.vx > 0 ? w-6 : 3), y+4, 3, 3);
}

/* ---------- disparos ---------- */

function dibujarDisparo(p, camX, camY){
  const x = Math.round(p.x - camX), y = Math.round(p.y - camY);
  if(x < -20 || x > VW+20) return;
  if(p.tipo === "rayo"){
    ctx.globalAlpha = 0.35; ctx.fillStyle = "#c9a0ff";
    ctx.beginPath(); ctx.arc(x+5, y+5, 8, 0, 6.3); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#8f5ae0";
    ctx.beginPath(); ctx.arc(x+5, y+5, 5, 0, 6.3); ctx.fill();
    ctx.fillStyle = "#f6e58c";
    ctx.beginPath(); ctx.arc(x+5, y+5, 2.4, 0, 6.3); ctx.fill();
  } else {
    dibujarBalon(x, y, 8, p.giro*6);
  }
}

/* ---------- jefa ---------- */

function dibujarJefa(j, camX, camY){
  const x = Math.round(j.x - camX), y = Math.round(j.y - camY);
  if(x > VW+80 || x + j.w < -80) return;

  ctx.globalAlpha = 0.24; ctx.fillStyle = "#000";
  ctx.fillRect(x+4, y + j.h - 2, 16, 2);
  ctx.globalAlpha = 1;

  if(j.derrotada){
    ctx.globalAlpha = Math.max(0, 1 - j.salida/60);
  } else if(j.invul > 0 && Math.floor(j.invul/4) % 2 === 0){
    ctx.globalAlpha = 0.45;
  }
  // aura
  if(!j.derrotada && j.activa){
    ctx.globalAlpha *= 1;
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.12*Math.sin(tiempo*0.08);
    ctx.fillStyle = "#3fd4c8";
    ctx.beginPath(); ctx.arc(x+8, y+14, 20, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.translate(x, y);
  if(j.mirando < 0){ ctx.translate(j.w, 0); ctx.scale(-1,1); }
  ctx.drawImage(SPR_JEFA, 0, j.enSuelo ? Math.floor(j.t/20)%2 : 0);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function barraJefa(j){
  if(!j.activa || j.derrotada) return;
  const w = 120, x = VW/2 - w/2, y = 12;
  ctx.fillStyle = "rgba(12,8,22,.7)"; ctx.fillRect(x-4, y-8, w+8, 20);
  ctx.fillStyle = "#a08fc0";
  ctx.font = "9px 'Courier New', monospace"; ctx.textAlign = "center";
  ctx.fillText("LUMINA, LA VISITANTE", VW/2, y-1);
  ctx.textAlign = "left";
  for(let i=0;i<JEFA.vidaMax;i++){
    ctx.fillStyle = i < j.vida ? "#3fd4c8" : "#3a3450";
    ctx.fillRect(x + i*(w/JEFA.vidaMax) + 2, y+3, w/JEFA.vidaMax - 4, 6);
  }
}

/* ---------- meta ---------- */

function dibujarMeta(m, d, camX, camY){
  const x = Math.round(m.x - camX), y = Math.round(m.y - camY);
  if(x > VW+40 || x < -40) return;
  const clase = TEMAS[d.tema].meta;
  const abierta = mundo.metaAbierta;

  if(abierta){
    const pulso = 0.5 + 0.5*Math.sin(tiempo*0.06);
    ctx.globalAlpha = 0.2 + pulso*0.25;
    ctx.fillStyle = "#ffd447";
    ctx.fillRect(x-8, y-10, 32, 50);
    ctx.globalAlpha = 1;
  }

  if(clase === "estacion"){
    ctx.fillStyle = "#5a4a6a"; ctx.fillRect(x-6, y-14, 28, 46);
    ctx.fillStyle = "#c9a06a"; ctx.fillRect(x-8, y-18, 32, 6);
    ctx.fillStyle = abierta ? "#2b2f3d" : "#1a1c24"; ctx.fillRect(x, y, 16, 32);
    ctx.fillStyle = "#6fb4c9"; ctx.fillRect(x+2, y+2, 12, 14);
    ctx.fillStyle = "#f6d98a"; ctx.fillRect(x-4, y-13, 24, 6);
    ctx.fillStyle = "#2b2f3d"; ctx.fillRect(x-2, y-12, 3, 4); ctx.fillRect(x+3, y-12, 3, 4);
    ctx.fillRect(x+8, y-12, 3, 4);
  } else if(clase === "puertaTren"){
    ctx.fillStyle = "#98a4b6"; ctx.fillRect(x-4, y-6, 24, 40);
    ctx.fillStyle = abierta ? "#20242c" : "#5b6472"; ctx.fillRect(x, y, 16, 32);
    ctx.fillStyle = "#cfe8f5"; ctx.fillRect(x+2, y+3, 5, 14); ctx.fillRect(x+9, y+3, 5, 14);
    ctx.fillStyle = "#3f4654"; ctx.fillRect(x+7, y, 2, 32);
  } else {
    // puerta común (escuela, casa, cuarto)
    ctx.fillStyle = "#6b4a2f"; ctx.fillRect(x-3, y-4, 22, 38);
    ctx.fillStyle = abierta ? "#3a2a1e" : "#8a5f38"; ctx.fillRect(x, y, 16, 32);
    ctx.fillStyle = "#c9a06a"; ctx.fillRect(x+2, y+2, 12, 12);
    ctx.fillStyle = "#ffd447"; ctx.fillRect(x+12, y+18, 2, 3);
    if(abierta){
      ctx.fillStyle = "#ffeaa0";
      for(let i=0;i<4;i++){
        const oy = (tiempo*0.9 + i*8) % 28;
        ctx.fillRect(x+4, y + 2 + Math.round(oy), 8, 2);
      }
    }
  }
  ctx.fillStyle = abierta ? "#fff" : "#7a6a8a";
  ctx.fillRect(x, y, 16, 2); ctx.fillRect(x, y+30, 16, 2);
}

/* ---------- escena completa ---------- */

function render(){
  const d = mundo.def;
  let camX = Math.round(mundo.camX), camY = Math.round(mundo.camY);
  if(sacudida > 0){
    camX += Math.round((Math.random()-0.5)*sacudida*0.9);
    camY += Math.round((Math.random()-0.5)*sacudida*0.9);
  }

  fondo(d, camX, camY);

  mundo.solidos.forEach(function(b){ bloque(b, d, camX, camY); });
  mundo.movers.forEach(function(b){ bloque(b, d, camX, camY); });
  mundo.peligros.forEach(function(p){ dibujarPeligro(p, d, camX, camY); });
  mundo.controles.forEach(function(cp){ dibujarControl(cp, camX, camY); });
  dibujarMeta(mundo.meta, d, camX, camY);
  mundo.monedas.forEach(function(c){ dibujarTaiyaki(c, camX, camY); });
  mundo.enemigos.forEach(function(e){ dibujarEnemigo(e, camX, camY); });
  if(mundo.jefe) dibujarJefa(mundo.jefe, camX, camY);
  mundo.disparos.forEach(function(p){ dibujarDisparo(p, camX, camY); });

  // partículas
  particulas.forEach(function(p){
    ctx.globalAlpha = Math.max(0, p.vida / p.max);
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x - camX), Math.round(p.y - camY), Math.round(p.s), Math.round(p.s));
  });
  ctx.globalAlpha = 1;

  // sombra del jugador
  ctx.globalAlpha = 0.22; ctx.fillStyle = "#000";
  ctx.fillRect(Math.round(jugador.x - camX), Math.round(jugador.y + jugador.h - 2 - camY), jugador.w, 2);
  ctx.globalAlpha = 1;

  // jugador
  const h = HEROES[jugador.heroe];
  let estado = "idle";
  if(jugador.muerto > 0) estado = "fall";
  else if(!jugador.enSuelo) estado = jugador.vy < 0 ? "jump" : "fall";
  else if(Math.abs(jugador.vx) > 0.3) estado = "run";

  const parpadeo = (tiempo % 190) < 6;
  const visible = jugador.invul === 0 || jugador.muerto > 0 || Math.floor(tiempo/4) % 2 === 0;

  if(visible){
    ctx.save();
    if(jugador.muerto > 0){
      ctx.translate(Math.round(jugador.x - h.offX - camX) + h.w/2, Math.round(jugador.y - h.offY - camY) + h.h/2);
      ctx.rotate((46 - jugador.muerto) * 0.09 * jugador.mirando);
      ctx.translate(-h.w/2, -h.h/2);
      dibujarHeroe(ctx, h, 0, 0, jugador.mirando, estado, tiempo, false);
    } else {
      dibujarHeroe(ctx, h, jugador.x - h.offX - camX, jugador.y - h.offY - camY, jugador.mirando, estado, tiempo, parpadeo);
    }
    ctx.restore();
  }

  if(mundo.jefe) barraJefa(mundo.jefe);

  // aviso de la jefa al entrar en su cuarto
  if(mundo.introJefe > 0){
    mundo.introJefe--;
    ctx.globalAlpha = Math.min(1, mundo.introJefe/40);
    ctx.fillStyle = "rgba(30,8,44,.72)";
    ctx.fillRect(0, 112, VW, 34);
    ctx.fillStyle = "#3fd4c8";
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText("¡SALTA SOBRE SU CABEZA 4 VECES!", VW/2, 134);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }

  // aviso de punto de control
  if(mundo.avisoControl > 0){
    ctx.globalAlpha = Math.min(1, mundo.avisoControl/30);
    ctx.fillStyle = "#ff85b0";
    ctx.font = "bold 11px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText("PUNTO DE CONTROL", VW/2, 40);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }

  // nombre del nivel al entrar
  if(mundo.introT > 0){
    mundo.introT--;
    ctx.globalAlpha = Math.min(1, mundo.introT/40);
    ctx.fillStyle = "rgba(12,8,22,.72)";
    ctx.fillRect(0, 108, VW, 42);
    ctx.fillStyle = "#ffd447";
    ctx.font = "bold 15px 'Courier New', monospace";
    ctx.textAlign = "center";
    ctx.fillText(d.nombre.toUpperCase(), VW/2, 128);
    ctx.fillStyle = "#a08fc0";
    ctx.font = "11px 'Courier New', monospace";
    ctx.fillText("Nivel " + (nivelIdx+1) + " de " + NIVELES.length, VW/2, 143);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }
}

/* pantalla de título: las dos hermanas animadas */
function renderTitulo(){
  const d = NIVELES[0];
  mundoFalso();
  fondo(d, tiempo*0.25, 0);
  ctx.fillStyle = TEMAS[d.tema].piso; ctx.fillRect(0, 224, VW, 48);
  ctx.fillStyle = TEMAS[d.tema].pisoTop; ctx.fillRect(0, 224, VW, 4);
  const t = tiempo;
  const hA = HEROES[0], hB = HEROES[1];
  dibujarHeroe(ctx, hA, 180, 224 - hA.h + Math.sin(t*0.05)*1, 1, "idle", t, (t%190)<6);
  dibujarHeroe(ctx, hB, 252, 224 - hB.h + Math.sin(t*0.05 + 1.6)*1, -1, "idle", t+40, ((t+90)%190)<6);
  for(let i=0;i<3;i++){
    const c = { x: 150 + i*70, y: 150, tomada:false, giro: t*0.09 + i };
    dibujarTaiyaki(c, 0, 0);
  }
}
function mundoFalso(){ if(!mundo) mundo = { def: NIVELES[0], camX:0, camY:0, metaAbierta:true, controles:[] }; }

/* ============================================================
   8. CONTROLES
   ============================================================ */

function pedirSalto(){
  jugador.buffer = 8;
  teclas.salto = true;
}

window.addEventListener("keydown", function(e){
  const k = e.key.toLowerCase();
  if(["arrowleft","arrowright","arrowup","arrowdown"," ","spacebar"].indexOf(k) >= 0) e.preventDefault();
  if(k === "arrowleft" || k === "a") bind("izq", true);
  if(k === "arrowright" || k === "d") bind("der", true);
  if(k === " " || k === "arrowup" || k === "w" || k === "spacebar"){
    if(modo === "jugando") pedirSalto(); else ovBtn.click();
  }
  if(k === "c") cambiarHermana();
  if(k === "n"){ alternarMenuNiveles(); }
  if(k === "r" && modo === "jugando"){
    descontarTaiyakiDelNivel();
    cargarNivel(nivelIdx); mundo.introT = 90;
  }
});
window.addEventListener("keyup", function(e){
  const k = e.key.toLowerCase();
  if(k === "arrowleft" || k === "a") bind("izq", false);
  if(k === "arrowright" || k === "d") bind("der", false);
  if(k === " " || k === "arrowup" || k === "w" || k === "spacebar") teclas.salto = false;
});

function cambiarHermana(){
  if(modo !== "jugando") return;
  jugador.heroe = (jugador.heroe + 1) % HEROES.length;
  jugador.saltosUsados = 0;
  sfxSwap();
  chispa(jugador.x + jugador.w/2, jugador.y + jugador.h/2, HEROES[jugador.heroe].aura);
  refrescarHUD();
}

function botonTactil(id, onDown, onUp){
  const el = document.getElementById(id);
  const down = function(e){ e.preventDefault(); onDown(); };
  const up = function(e){ e.preventDefault(); if(onUp) onUp(); };
  el.addEventListener("touchstart", down, {passive:false});
  el.addEventListener("touchend", up, {passive:false});
  el.addEventListener("touchcancel", up, {passive:false});
  el.addEventListener("mousedown", down);
  el.addEventListener("mouseup", up);
  el.addEventListener("mouseleave", up);
}
botonTactil("tIzq", function(){ bind("izq", true); }, function(){ bind("izq", false); });
botonTactil("tDer", function(){ bind("der", true); }, function(){ bind("der", false); });
botonTactil("tSalto", function(){ if(modo === "jugando") pedirSalto(); }, function(){ teclas.salto = false; });
botonTactil("tSwap", function(){ cambiarHermana(); }, null);

/* ============================================================
   9. OVERLAYS Y FLUJO
   ============================================================ */

const ovNiveles = document.getElementById("ovNiveles");
const botonesNivel = NIVELES.map(function(n, i){
  const b = document.createElement("button");
  b.innerHTML = "<b>Nivel " + (i+1) + "</b>" + n.nombre;
  b.addEventListener("click", function(){ irANivel(i); });
  ovNiveles.appendChild(b);
  return b;
});

function marcarNivelActual(){
  botonesNivel.forEach(function(b, i){ b.className = (i === nivelIdx ? "act" : ""); });
}

function mostrarOverlay(titulo, texto, boton, mostrarDuo, mostrarNiveles){
  ovTitulo.textContent = titulo;
  ovTexto.textContent = texto;
  ovBtn.textContent = boton;
  ovDuo.style.display = mostrarDuo ? "flex" : "none";
  ovNiveles.classList.toggle("oculto", !mostrarNiveles);
  marcarNivelActual();
  overlay.classList.remove("oculto");
}
function ocultarOverlay(){ overlay.classList.add("oculto"); }

/* menú de niveles: también funciona como pausa durante la partida */
function alternarMenuNiveles(){
  if(modo === "jugando"){
    modo = "pausa";
    bind("izq", false); bind("der", false); teclas.salto = false;
    mostrarOverlay("Elige nivel",
      "Nivel actual: " + NIVELES[nivelIdx].nombre + ". Llevas " + monedasTotal + " taiyaki.",
      "Seguir jugando", false, true);
  } else if(modo === "pausa"){
    modo = "jugando";
    ocultarOverlay();
  } else {
    ovNiveles.classList.toggle("oculto");
    marcarNivelActual();
  }
}

function irANivel(i){
  audio();
  if(modo === "jugando" || modo === "pausa") descontarTaiyakiDelNivel();
  if(modo === "titulo" || modo === "gameover" || modo === "victoria"){
    vidas = 3; monedasTotal = 0;
  }
  if(vidas <= 0) vidas = 3;
  nivelIdx = i;
  cargarNivel(i);
  mundo.introT = 110;
  modo = "jugando";
  ocultarOverlay();
}

document.getElementById("btnNiveles").addEventListener("click", alternarMenuNiveles);

ovBtn.addEventListener("click", function(){
  audio();
  if(modo === "pausa"){
    modo = "jugando"; ocultarOverlay(); return;
  }
  if(modo === "titulo"){
    nivelIdx = 0; vidas = 3; monedasTotal = 0;
    cargarNivel(0); mundo.introT = 110;
    modo = "jugando"; ocultarOverlay();
  } else if(modo === "nivelListo"){
    nivelIdx++;
    cargarNivel(nivelIdx); mundo.introT = 110;
    modo = "jugando"; ocultarOverlay();
  } else if(modo === "gameover" || modo === "victoria"){
    nivelIdx = 0; vidas = 3; monedasTotal = 0;
    cargarNivel(0); mundo.introT = 110;
    modo = "jugando"; ocultarOverlay();
  }
});

/* ============================================================
   10. BUCLE PRINCIPAL (paso fijo a 60fps)
   ============================================================ */

let ultimo = performance.now(), acumulado = 0;
const PASO = 1000/60;

function bucle(ahora){
  requestAnimationFrame(bucle);
  let dt = ahora - ultimo; ultimo = ahora;
  if(dt > 200) dt = 200;
  acumulado += dt;

  while(acumulado >= PASO){
    acumulado -= PASO;
    if(modo === "jugando") actualizar();
    else tiempo++;
  }

  if(modo === "jugando") render();
  else if(modo === "titulo") renderTitulo();
  else if(mundo && mundo.def && mundo.solidos) render();
}

// arranque
mostrarOverlay("Mikan & Yami",
  "Cinco niveles desde la secundaria hasta su casa: pasillos y escaleras, el barrio comercial, " +
  "el tren, la calle residencial y, al final, la visitante que espera en el cuarto. " +
  "Cambia de hermana para superar cada obstáculo y junta taiyaki por el camino.",
  "Empezar", true, true);
mundo = { def: NIVELES[0], camX:0, camY:0, introT:0, metaAbierta:true };
requestAnimationFrame(bucle);

})();
